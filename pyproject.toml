[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "pyroma621"
version = "6.2.0.dev0"
description = "Test your project's packaging friendliness"
readme = "README.md"
authors = [
    {name = "Harold Martin", email = "harold.martin@gmail.com"},
    {name = "Lennart Regebro", email = "regebro@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Typing :: Typed",
]
keywords = ["pypi", "quality", "testing"]
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
dependencies = [
    "build>=0.7.0",
    "docutils>=0.22",
    "markdown-it-py>=4.2.0",
    "packaging>=26.3",
    "pygments>=2.19",
    "requests>=2.32",
    "trove-classifiers>=2022.6.26",
    "validate-pyproject>=0.16",
]

[dependency-groups]
test = [
    {include-group = "release"},
    "check-manifest",
    "jsonschema>=4.25.1",
    "hypothesis>=6.156.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyproject-hooks>=1.3.3",
    "setuptools>=77",
    "zest.releaser",
    "pep440",
    "flit_core>=3.4,<4",
    "uv_build>=0.13.0,<0.14.0",
    "tox>=4.22",
]

audit = ["packaging>=26.3", "pip-audit==2.10.1"]
release = ["markdown-it-py>=4.2.0", "packaging>=26.3", "PyYAML>=6.0.3"]
docs = [{include-group = "release"}, "zensical>=0.0.50"]
dev = [
    {include-group = "test"},
    "deptry>=0.25.1",
    "lizard>=1.23.0",
    "pyrefly>=1.1.1",
    "ruff==0.15.22",
    "ty>=0.0.61",
]
lint = ["ruff==0.15.22"]
quality = ["deptry>=0.25.1", "lizard>=1.23.0", "semgrep==1.180.0"]
typecheck = ["pyrefly>=1.1.1", "ty>=0.0.61", "types-docutils"]

[tool.uv.build-backend]
module-name = "pyroma"
module-root = ""
source-include = [".pre-commit-hooks.yaml", ".github/workflows/docs.yml", "ci/**", "docs/**", "tests/**", "audit-exceptions.toml", "conftest.py", "Makefile", "tox.ini", "uv.lock", "zensical.toml"]
source-exclude = ["**/.DS_Store", "*.egg-info", "__pycache__", "*.pyc", "*.pyo", "build", "dist", "docs/schemas/**"]

[project.urls]
Homepage = "https://github.com/hbmartin/pyroma621"
"Source Code" = "https://github.com/hbmartin/pyroma621"
Documentation = "https://hbmartin.github.io/pyroma621/"
Changelog = "https://hbmartin.github.io/pyroma621/changelog/"
Issues = "https://github.com/hbmartin/pyroma621/issues"

[project.scripts]
pyroma = "pyroma:main"

[project.entry-points."zest.releaser.prereleaser.before"]
pyroma = "pyroma:zester"

[tool.pytest.ini_options]
testpaths = ["pyroma/tests.py", "tests/property", "tests/ci", "tests/contract"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pyroma"]
branch = true
omit = ["*/pyroma/tests.py", "*/pyroma/testdata/*"]

[tool.coverage.report]
fail_under = 94
precision = 2
show_missing = true

[tool.check-manifest]
# uv_build includes the original TOML alongside its normalized pyproject.toml.
ignore = [".pre-commit-config.yaml", ".semgrep.yml", "pyproject.toml.orig"]

[tool.garuff]
# Keep existing function signatures, test documentation style, and example names.
ignore = ["GAC010", "GAC008", "GAC011"]

[tool.deptry]
extend_exclude = ["conftest.py", "pyroma/testdata", "pyroma/tests.py", "tests"]
known_first_party = ["pyroma"]
package_module_name_map = {PyYAML = "yaml"}

[tool.deptry.per_rule_ignores]
# zest.releaser calls this optional integration hook when it is installed.
DEP001 = ["zest"]
# Pygments is loaded indirectly by docutils for syntax-highlighted content.
DEP002 = ["pygments"]
# These development-only packages enable optional integrations and CI release checks.
DEP004 = ["check_manifest", "zest", "yaml"]

[tool.zest-releaser]
create-wheel = true
history-file = "docs/changelog.md"
history_format = "md"

[tool.ty.src]
include = ["pyroma"]
exclude = ["pyroma/testdata", "pyroma/tests.py"]

[tool.pyrefly]
project-includes = ["pyroma"]
project-excludes = ["pyroma/testdata/**", "pyroma/tests.py"]

[tool.pyrefly.errors]
# The str() calls on metadata values are deliberate runtime defenses:
# the Metadata TypedDict is aspirational for JSON-sourced data.
unnecessary-type-conversion = false

[tool.ruff]
exclude = [".bzr", ".direnv", ".eggs", ".git", ".git-rewrite", ".hg", ".ipynb_checkpoints", ".mypy_cache", ".nox", ".pants.d", ".pyenv", ".pytest_cache", ".pytype", ".ruff_cache", ".svn", ".tox", ".venv", ".vscode", "__pypackages__", "_build", "buck-out", "build", "dist", "node_modules", "papers PDFs", "setup.py", "site-packages", "venv"]
line-length = 120
extend-exclude = ["pyroma/testdata"]
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D203", "D213"]

[tool.ruff.lint.isort]
# Generated artifact directories must not make the build dependency first-party.
known-third-party = ["build"]

[tool.ruff.lint.per-file-ignores]
"pyroma/__init__.py" = ["T201"]
"pyroma/tests.py" = ["ANN202", "D", "FBT003", "PT009", "PT027", "RUF059", "SLF001"]
# Pytest assertions/booleans, literal contract boundaries, and private-rule coverage.
"tests/**/*.py" = ["D", "FBT001", "FBT003", "PLR2004", "S101", "SLF001"]
"ci/*.py" = ["T201", "S603"]
