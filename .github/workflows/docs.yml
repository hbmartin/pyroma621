name: Documentation

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    outputs:
      schema_paths: ${{ steps.schema_build_outputs.outputs.schema_paths }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.13.0'
      - name: Prepare downloadable report schemas
        run: uv run --locked --only-group docs python ci/release_docs.py schemas
      - name: Build documentation
        run: uv run --locked --only-group docs zensical build --clean --strict
      - name: Check JSON guide and schema build outputs
        id: schema_build_outputs
        shell: bash
        run: |
          uv run --locked --only-group docs python ci/release_docs.py check-schemas \
            --inventory-output "$RUNNER_TEMP/schema-inventory.json"
          manifest=$(cat "$RUNNER_TEMP/schema-inventory.json")
          printf 'schema_paths=%s\n' "$manifest" >> "$GITHUB_OUTPUT"
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: Deploy documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Check JSON guide and schema availability
        id: schema_availability
        shell: bash
        env:
          DOCS_URL: ${{ steps.deployment.outputs.page_url }}
          SCHEMA_PATHS_JSON: ${{ needs.build.outputs.schema_paths }}
        run: |
          paths=$(python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.parse import quote

          raw = os.environ.get("SCHEMA_PATHS_JSON", "")
          if not raw:
              sys.exit("Schema inventory from build is missing")
          try:
              paths = json.loads(raw)
          except ValueError:
              sys.exit("Schema inventory from build must contain valid JSON")
          if not isinstance(paths, list):
              sys.exit("Schema inventory from build must be a list of schema paths")
          if not paths:
              sys.exit("Schema inventory from build has no JSON schemas")
          for path in paths:
              if (not isinstance(path, str) or not path.startswith("schemas/")
                      or not path.endswith(".json")
                      or any(part in {"", ".", ".."} for part in path.split("/"))):
                  sys.exit("Schema inventory from build contains an invalid schema path")
          if len(set(paths)) != len(paths):
              sys.exit("Schema inventory from build contains duplicate schema paths")
          print("json/")
          for path in paths:
              print(quote(path, safe="/"))
          PY
          )
          printf '%s\n' "$paths" | while IFS= read -r path; do
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 5 --max-time 15 \
              --output /dev/null "${DOCS_URL%/}/$path"
          done
