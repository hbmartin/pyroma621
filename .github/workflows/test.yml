# Runs the unit tests for the pyroma package
# Based on https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test package

on: [push, pull_request, workflow_dispatch]

env:
  FORCE_COLOR: 1

permissions:
  contents: read

jobs:
  macos-pypy-release:
    name: Release validation (macOS PyPy 3.11)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Set up PyPy
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 'pypy-3.11'
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.13.0'
          python-version: 'pypy-3.11'
      - name: Require descriptor-backed schema traversal
        run: >-
          uv run --locked --no-default-groups --group test python -c
          'from ci import release_docs; assert release_docs._anchored_paths_supported(), "macOS PyPy must anchor schema traversal"'
      - name: Test release validation
        run: >-
          uv run --locked --no-default-groups --group test python -bb -X dev -m pytest
          tests/ci/test_release_docs.py --no-cov --junitxml=macos-pypy-release-results.xml
      - name: Upload release test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-pypy-release-results
          path: macos-pypy-release-results.xml
          if-no-files-found: warn

  build:
    name: Tests

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.14', 'pypy-3.11']

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.13.0'
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: >-
          uv run --locked --no-default-groups --group test python -bb -X dev -m pytest
          --cov --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn
      - name: Upload coverage to Codecov
        if: >-
          ${{ !cancelled() && hashFiles('coverage.xml') != '' &&
              (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: false
          name: source-${{ matrix.os }}-${{ matrix.python-version }}
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
